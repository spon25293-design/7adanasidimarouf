<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام حضانة السعادة الذكي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&family=Reem+Kufi:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #ff6b6b; --secondary: #4ecdc4; --dark: #2d3436; }
        body { font-family: 'Tajawal', sans-serif; background: radial-gradient(circle at top right, #fff5f5, #fff0e0); min-height: 100vh; overflow-x: hidden; }
        .developer-name { font-family: 'Reem Kufi', sans-serif; background: linear-gradient(45deg, #ff0080, #7928ca, #ff0080); background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: shine 3s linear infinite; }
        .hero-anime { animation: float 6s ease-in-out infinite; }
        @keyframes float { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-20px) rotate(5deg); } }
        .bg-blob { position: fixed; width: 300px; height: 300px; background: rgba(255, 107, 107, 0.1); filter: blur(80px); border-radius: 50%; z-index: -1; animation: move 20s infinite alternate; }
        @keyframes move { from { top: -10%; right: -10%; } to { bottom: 10%; left: 10%; } }
        @keyframes shine { to { background-position: 200% center; } }
        @media (max-width: 768px) {
            tr { display: block; margin-bottom: 1.5rem; background: rgba(255,255,255,0.8); backdrop-filter: blur(10px); border-radius: 20px; padding: 15px; border: 1px solid rgba(255,255,255,0.3); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05); }
            td { display: flex; justify-content: space-between; padding: 8px 0 !important; border: none !important; border-bottom: 1px dashed #eee !important; }
            td:last-child { border: none !important; }
            td::before { content: attr(data-label); font-weight: bold; color: #888; font-size: 0.8rem; }
            thead { display: none; }
        }
        .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.4); }
    </style>
</head>
<body>
    <div class="bg-blob"></div>

    <div class="fixed top-4 right-4 z-50 glass p-3 px-5 rounded-2xl shadow-xl border-b-4 border-pink-500 flex flex-col items-center animate-bounce">
        <span class="text-[10px] text-gray-500 font-bold">DEVELOPED BY</span>
        <span class="developer-name text-lg font-bold">✨ محمد بوالرواين ✨</span>
    </div>

    <div id="home-screen" class="min-h-screen flex flex-col items-center justify-center p-6">
        <div class="relative">
            <div class="text-[120px] hero-anime">👶</div>
            <div class="absolute -top-4 -right-4 text-4xl animate-pulse">✨</div>
            <div class="absolute bottom-0 -left-8 text-5xl animate-bounce">🎨</div>
        </div>
        <h1 class="text-5xl font-black text-gray-800 mb-2 mt-4 text-center">حضانة <span class="text-pink-500">الإبداع</span></h1>
        <p class="text-gray-500 text-lg mb-10 text-center max-w-md italic">حيث تتحول الخطوات الأولى إلى أحلام كبيرة</p>
        <div class="grid grid-cols-1 gap-4 w-full max-w-xs">
            <button onclick="prepareForm()" class="bg-pink-500 text-white p-5 rounded-3xl font-bold shadow-[0_10px_20px_rgba(236,72,153,0.3)] hover:scale-105 active:scale-95 transition-all flex items-center justify-center gap-2">
                <span>📝 تسجيل طفل جديد</span>
            </button>
            <button onclick="showSection('login')" class="glass text-blue-600 p-5 rounded-3xl font-bold shadow-lg hover:bg-blue-50 active:scale-95 transition-all flex items-center justify-center gap-2 border-2 border-blue-100">
                <span>👩‍🏫 بوابة المعلمة</span>
            </button>
        </div>
    </div>

    <div id="parent-section" class="hidden min-h-screen p-4 py-12">
        <div class="max-w-xl mx-auto glass rounded-[40px] p-8 shadow-2xl relative overflow-hidden">
            <input type="hidden" id="edit_id">
            <h2 id="form-title" class="text-3xl font-bold text-gray-800 mb-8 flex items-center gap-2">بيانات العبقري الصغير</h2>
            
            <div class="space-y-4">
                <input type="text" id="c_name" placeholder="الاسم الكامل للطفل" class="w-full p-4 rounded-2xl border-2 border-gray-100 focus:border-pink-400 outline-none">
                <div class="grid grid-cols-2 gap-4">
                    <input type="number" id="c_age" placeholder="العمر" class="p-4 rounded-2xl border-2 border-gray-100 focus:border-pink-400 outline-none">
                    <select id="c_gender" class="p-4 rounded-2xl border-2 border-gray-100 focus:border-pink-400 outline-none bg-white">
                        <option value="">الجنس</option>
                        <option value="ذكر">ذكر 👦</option>
                        <option value="أنثى">أنثى 👧</option>
                    </select>
                </div>
                <input type="tel" id="m_phone" placeholder="رقم هاتف الولي" class="w-full p-4 rounded-2xl border-2 border-gray-100 focus:border-pink-400 outline-none">
                <textarea id="c_desc" placeholder="وصف الطفل أو ملاحظات هامة..." class="w-full p-4 rounded-2xl border-2 border-gray-100 focus:border-pink-400 h-28 outline-none"></textarea>

                <div class="bg-white/50 p-6 rounded-3xl border-2 border-dashed border-pink-200">
                    <label class="font-bold text-pink-600 block mb-3">تفاصيل الاشتراك</label>
                    <select id="reg_type" onchange="toggleInputs()" class="w-full p-3 rounded-xl border-2 border-pink-50 mb-3 outline-none">
                        <option value="monthly">اشتراك شهري (30 يوم)</option>
                        <option value="daily">دفع يومي</option>
                    </select>
                    <div id="monthly_input">
                        <label class="text-xs text-gray-400">تاريخ أول يوم حضور:</label>
                        <input type="date" id="start_date" onchange="updateExpiryPreview()" class="w-full p-3 rounded-xl border-2 border-gray-100 mt-1 outline-none">
                        <p id="expiry_preview" class="mt-2 text-sm text-pink-500 font-bold hidden"></p>
                    </div>
                </div>
            </div>

            <button onclick="saveKid()" id="save-btn" class="w-full mt-8 bg-gray-900 text-white py-5 rounded-3xl font-bold text-lg shadow-xl hover:bg-black transition-all">إتمام التسجيل ✨</button>
            <button onclick="showSection('home')" class="w-full mt-4 text-gray-400 font-bold">إلغاء</button>
        </div>
    </div>

    <div id="teacher-section" class="hidden min-h-screen p-4 md:p-8">
        <div class="max-w-6xl mx-auto">
            <div class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
                <div>
                    <h1 class="text-3xl font-black text-gray-800">مرحباً <span class="text-blue-600">أستاذة وهيبة</span> 👋</h1>
                    <p class="text-gray-500">لديكِ <span id="count" class="font-bold text-blue-600">0</span> أطفال تحت رعايتك</p>
                </div>
                <button onclick="showSection('home')" class="bg-red-50 text-red-500 px-6 py-3 rounded-2xl font-bold border border-red-100">تسجيل الخروج</button>
            </div>

            <div class="overflow-hidden bg-white/30 rounded-3xl shadow-sm">
                <table class="w-full text-right border-collapse">
                    <thead class="bg-white/80 glass">
                        <tr>
                            <th class="p-5 text-gray-800 font-bold">الطفل</th>
                            <th class="p-5 text-gray-800 font-bold text-pink-500">تاريخ الانتهاء</th>
                            <th class="p-5 text-gray-800 font-bold">الهاتف</th>
                            <th class="p-5 text-gray-800 font-bold">الملاحظات</th>
                            <th class="p-5 text-center">إجراءات</th>
                        </tr>
                    </thead>
                    <tbody id="kids-table" class="divide-y divide-gray-100"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="login-section" class="hidden min-h-screen flex items-center justify-center p-4">
        <div class="glass p-10 rounded-[40px] shadow-2xl w-full max-w-md border-t-8 border-blue-600 text-center">
            <div class="text-5xl mb-4">🔐</div>
            <h2 class="text-2xl font-bold mb-6">الدخول الآمن للأستاذة</h2>
            <input type="text" id="userIn" placeholder="اسم المستخدم" class="w-full p-4 mb-4 rounded-2xl border-2 outline-none">
            <input type="password" id="passIn" placeholder="كلمة المرور" class="w-full p-4 mb-6 rounded-2xl border-2 outline-none">
            <button onclick="handleLogin()" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-bold shadow-lg shadow-blue-200">دخول النظام</button>
            <button onclick="showSection('home')" class="mt-4 text-gray-400 block w-full text-sm">العودة للرئيسية</button>
        </div>
    </div>

    <script>
        let db = JSON.parse(localStorage.getItem('nursery_pro_db')) || [];

        function showSection(id) {
            document.querySelectorAll('div[id$="-screen"], div[id$="-section"]').forEach(s => s.classList.add('hidden'));
            document.getElementById(id + (id === 'home' ? '-screen' : '-section')).classList.remove('hidden');
            window.scrollTo(0,0);
        }

        function toggleInputs() {
            const isDaily = document.getElementById('reg_type').value === 'daily';
            document.getElementById('monthly_input').classList.toggle('hidden', isDaily);
            if(isDaily) document.getElementById('expiry_preview').classList.add('hidden');
        }

        function updateExpiryPreview() {
            const start = document.getElementById('start_date').value;
            const preview = document.getElementById('expiry_preview');
            if(start) {
                let d = new Date(start);
                d.setDate(d.getDate() + 30);
                preview.innerText = "📅 تاريخ انتهاء الاشتراك: " + d.toISOString().split('T')[0];
                preview.classList.remove('hidden');
            }
        }

        function prepareForm() {
            document.getElementById('edit_id').value = '';
            document.getElementById('form-title').innerText = 'بيانات العبقري الصغير';
            document.getElementById('save-btn').innerText = 'إتمام التسجيل ✨';
            document.getElementById('c_name').value = '';
            document.getElementById('m_phone').value = '';
            document.getElementById('c_age').value = '';
            document.getElementById('c_desc').value = '';
            showSection('parent');
        }

        function handleLogin() {
            if(document.getElementById('userIn').value === 'wahiba2005' && document.getElementById('passIn').value === 'mouha2005') {
                showSection('teacher');
                renderTable();
            } else { alert("❌ عذراً! المعلومات غير صحيحة"); }
        }

        function saveKid() {
            const name = document.getElementById('c_name').value;
            const phone = document.getElementById('m_phone').value;
            const start = document.getElementById('start_date').value;
            const type = document.getElementById('reg_type').value;
            const editId = document.getElementById('edit_id').value;

            if(!name || !phone) return alert("من فضلك أدخلي اسم الطفل ورقم الهاتف");

            let endStr = "يومي متجدد";
            if(type === 'monthly' && start) {
                let d = new Date(start);
                d.setDate(d.getDate() + 30);
                endStr = d.toISOString().split('T')[0];
            }

            const kidData = {
                id: editId ? parseInt(editId) : Date.now(),
                regDate: new Date().toLocaleDateString('ar-DZ'),
                name: name,
                age: document.getElementById('c_age').value || "?",
                gender: document.getElementById('c_gender').value || "غير محدد",
                phone: phone,
                desc: document.getElementById('c_desc').value || "لا توجد ملاحظات",
                type: type,
                end: endStr
            };

            if(editId) {
                const index = db.findIndex(k => k.id === parseInt(editId));
                db[index] = kidData;
            } else {
                db.push(kidData);
            }

            localStorage.setItem('nursery_pro_db', JSON.stringify(db));
            alert("✅ تم حفظ البيانات بنجاح");
            showSection('home');
        }

        function renderTable() {
            const tbody = document.getElementById('kids-table');
            const countLabel = document.getElementById('count');
            tbody.innerHTML = '';
            countLabel.innerText = db.length;

            db.forEach(k => {
                const isExpired = k.end !== "يومي متجدد" && new Date(k.end) < new Date();
                
                tbody.innerHTML += `
                    <tr class="bg-white/50 hover:bg-white transition-all">
                        <td class="p-5" data-label="الطفل">
                            <div class="font-bold text-gray-800">${k.name}</div>
                            <div class="text-[10px] text-blue-500">${k.gender} - ${k.age} سنوات</div>
                            <div class="text-[9px] text-gray-400">سجل في: ${k.regDate}</div>
                        </td>
                        <td class="p-5 font-bold ${isExpired ? 'text-red-500 animate-pulse' : 'text-green-600'}" data-label="تاريخ الانتهاء">
                            ${k.end} ${isExpired ? '<br><span class="text-[10px]">(منتهي!)</span>' : ''}
                        </td>
                        <td class="p-5 text-sm" data-label="الهاتف">${k.phone}</td>
                        <td class="p-5 text-xs text-gray-500 italic" data-label="الملاحظات">${k.desc}</td>
                        <td class="p-5" data-label="إجراءات">
                            <div class="flex gap-2 justify-center">
                                <a href="tel:${k.phone}" class="bg-green-500 text-white p-2 rounded-xl shadow-md">📞</a>
                                <button onclick="editKid(${k.id})" class="bg-blue-500 text-white p-2 rounded-xl shadow-md">✏️</button>
                                <button onclick="deleteKid(${k.id})" class="bg-red-100 text-red-500 p-2 rounded-xl">🗑️</button>
                            </div>
                        </td>
                    </tr>`;
            });

            if(db.length === 0) tbody.innerHTML = '<tr><td colspan="5" class="p-20 text-center text-gray-300">لا توجد بيانات حالياً.. 🏠</td></tr>';
        }

        function editKid(id) {
            const kid = db.find(k => k.id === id);
            if(kid) {
                showSection('parent');
                document.getElementById('edit_id').value = kid.id;
                document.getElementById('form-title').innerText = 'تعديل بيانات: ' + kid.name;
                document.getElementById('save-btn').innerText = 'تحديث البيانات 💾';
                document.getElementById('c_name').value = kid.name;
                document.getElementById('m_phone').value = kid.phone;
                document.getElementById('c_age').value = kid.age;
                document.getElementById('c_desc').value = kid.desc;
                document.getElementById('c_gender').value = kid.gender;
                document.getElementById('reg_type').value = kid.type;
                toggleInputs();
            }
        }

        function deleteKid(id) {
            if(confirm('هل تريدين إزالة هذا الطفل نهائياً؟')) {
                db = db.filter(k => k.id !== id);
                localStorage.setItem('nursery_pro_db', JSON.stringify(db));
                renderTable();
            }
        }
    </script>
</body>
</html>
